name: SDK audit

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1,15 * *' # fortnightly: 1st and 15th of each month

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: SDK spec drift (installed SDK vs latest published spec)
        run: python3 .github/scripts/spec_drift.py

      - name: Platform changelog drift (Sent.dm's changelog vs last-reviewed snapshot)
        run: python3 .github/scripts/changelog_drift.py
