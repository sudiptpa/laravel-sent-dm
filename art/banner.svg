<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>

    <!-- Blue glow gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#005CEC" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#005CEC" stop-opacity="0"/>
    </radialGradient>

    <!-- Left warm glow (Laravel) -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F05340" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F05340" stop-opacity="0"/>
    </radialGradient>

    <!-- Right green glow -->
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle noise filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="320" rx="320" ry="260" fill="url(#redGlow)"/>
  <ellipse cx="640" cy="320" rx="400" ry="300" fill="url(#blueGlow)"/>
  <ellipse cx="1080" cy="320" rx="320" ry="260" fill="url(#greenGlow)"/>

  <!-- ─── LEFT NODE: Laravel app ─────────────────────────────── -->
  <!-- Outer ring -->
  <circle cx="192" cy="320" r="88" fill="none" stroke="#F05340" stroke-width="1" opacity="0.18"/>
  <circle cx="192" cy="320" r="64" fill="none" stroke="#F05340" stroke-width="1" opacity="0.28"/>
  <!-- Main circle -->
  <circle cx="192" cy="320" r="48" fill="#1A0E0C" stroke="#F05340" stroke-width="1.5" opacity="0.9"/>

  <!-- Laravel official logo mark (github.com/laravel/art) — centered, larger scale -->
  <g transform="translate(192, 320) scale(0.025) translate(-944, -944)">
    <path d="M791.5 1714L215 1381.5c-8.5-5.5-15-8.5-15-19.5V357.5c0-8.158 5-13.5 9.5-16L502 173c9.5-5.5 17.5-5.5 26.5 0L819 340c11.5 6.5 12 15 12 22.5v622L1073.5 845V527c0-11 5-17.5 17-24.5L1380 336c7-4 12.5-4 19.5 0l295 170c9.5 5.5 10.5 12 10.5 21.5V858c0 10.5-2.5 16-13 22.5l-278.5 160v317c0 12.5-3 17.5-14 24L821 1714c-11 6-18.5 6-29.5 0zm-9-61.5v-279l-276-156c-9-5.5-15.5-9.5-15.5-23V543L248 403.5V1345zm583-307.5v-277L831 1373.5v279zm-25.528-318.167L1098 886.5 565 1194l241 137zM782.5 1012V403L540 543v609zm583-28V708l-243-140v277zm291-139V568l-243 140v276zm-267-179.5l242-139.5-242-139.5L1147 526zM757.635 361.004L515 221.5 273 361l242 140z" fill="#F05340" opacity="0.95"/>
  </g>

  <!-- "PHP" label -->
  <text x="192" y="390" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#F05340" opacity="0.6" letter-spacing="2">PHP · LARAVEL</text>

  <!-- ─── CONNECTION LINES ────────────────────────────────────── -->
  <!-- Left app → center package, dashed animated-style -->
  <!-- Main path: curved bezier -->
  <path d="M244 300 C330 260, 420 270, 490 310" fill="none" stroke="#005CEC" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.35"/>
  <path d="M244 340 C330 380, 420 370, 490 330" fill="none" stroke="#F05340" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.25"/>

  <!-- Traveling dots on paths (static, suggesting motion) -->
  <circle cx="330" cy="272" r="3" fill="#005CEC" opacity="0.7"/>
  <circle cx="390" cy="283" r="2.5" fill="#005CEC" opacity="0.5"/>
  <circle cx="450" cy="301" r="2" fill="#005CEC" opacity="0.35"/>

  <!-- Center → right paths -->
  <path d="M790 295 C860 260, 940 255, 1010 290" fill="none" stroke="#005CEC" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.35"/>
  <path d="M790 320 C870 320, 950 320, 1010 320" fill="none" stroke="#22C55E" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>
  <path d="M790 345 C860 380, 940 385, 1010 350" fill="none" stroke="#FD8002" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.25"/>

  <!-- Traveling dots right -->
  <circle cx="870" cy="274" r="3" fill="#22C55E" opacity="0.7"/>
  <circle cx="940" cy="267" r="2.5" fill="#22C55E" opacity="0.5"/>
  <circle cx="990" cy="278" r="2" fill="#22C55E" opacity="0.35"/>

  <!-- ─── CENTER: Package identity ────────────────────────────── -->
  <!-- Outer decorative ring -->
  <circle cx="640" cy="300" r="130" fill="none" stroke="#005CEC" stroke-width="0.75" opacity="0.12"/>
  <circle cx="640" cy="300" r="108" fill="none" stroke="#005CEC" stroke-width="0.75" opacity="0.18"/>

  <!-- Package name — single-line two-colour wordmark -->
  <text x="640" y="325"
        text-anchor="middle"
        font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="-2">
    <tspan fill="#E8A090" opacity="0.85">laravel-</tspan><tspan fill="#005CEC">sent-dm</tspan>
  </text>

  <!-- Subtle tag -->
  <text x="640" y="375"
        text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="13"
        fill="#ffffff"
        opacity="0.28"
        letter-spacing="3">UNIFIED MESSAGING ADAPTER</text>

  <!-- ─── RIGHT NODE: Sent.dm ─────────────────────────────────── -->
  <!-- Outer rings -->
  <circle cx="1088" cy="312" r="88" fill="none" stroke="#005CEC" stroke-width="1" opacity="0.14"/>
  <circle cx="1088" cy="312" r="64" fill="none" stroke="#005CEC" stroke-width="1" opacity="0.22"/>
  <!-- Inner circle -->
  <circle cx="1088" cy="312" r="48" fill="#0D1A33" stroke="#005CEC" stroke-width="1.5" opacity="0.9"/>

  <!-- Sent.dm official logo mark (white, SVG paths from sent.dm, viewBox 0 0 1000 1000) -->
  <g transform="translate(1055, 279) scale(0.066)">
    <path d="M413.439 275.528C396.838 269.254 388.466 250.709 394.74 234.108L456.845 69.7828C463.119 53.1814 481.664 44.8096 498.265 51.0839L979.217 232.854C995.819 239.128 1004.19 257.672 997.916 274.274L816.146 755.226C809.872 771.827 791.328 780.199 774.726 773.925L610.401 711.82C593.799 705.546 585.428 687.001 591.702 670.4L688.646 413.892C694.92 397.291 686.548 378.746 669.947 372.472L413.439 275.528Z" fill="#FFFFFF"/>
    <path d="M20.7828 451.048C4.18136 444.774 -4.19043 426.229 2.08387 409.628L64.1885 245.303C70.4628 228.701 89.0073 220.33 105.609 226.604L586.561 408.374C603.162 414.648 611.534 433.192 605.26 449.794L423.49 930.746C417.216 947.347 398.671 955.719 382.07 949.445L217.744 887.34C201.143 881.066 192.771 862.521 199.046 845.92L295.989 589.412C302.264 572.811 293.892 554.266 277.291 547.992L20.7828 451.048Z" fill="#FFFFFF"/>
  </g>

  <!-- sent.dm label -->
  <text x="1088" y="382" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="11" fill="#005CEC" opacity="0.7" letter-spacing="2">sent.dm</text>

  <!-- Channel pills below the node -->
  <rect x="1022" y="396" width="46" height="18" rx="9" fill="#005CEC" opacity="0.8"/>
  <text x="1045" y="409" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="1">SMS</text>

  <rect x="1074" y="396" width="66" height="18" rx="9" fill="#1A9F4B" opacity="0.8"/>
  <text x="1107" y="409" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="1">WHATSAPP</text>

  <rect x="1146" y="396" width="36" height="18" rx="9" fill="#2563EB" opacity="0.8"/>
  <text x="1164" y="409" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="1">RCS</text>

  <!-- ─── STATUS BADGE ROW ──────────────────────────────────────── -->
  <!-- Queued -->
  <rect x="413" y="428" width="82" height="22" rx="11" fill="#1E1E2E" stroke="#52525B" stroke-width="1"/>
  <circle cx="428" cy="439" r="4" fill="#71717A"/>
  <text x="436" y="444" font-family="'SF Mono', monospace" font-size="10" fill="#71717A" letter-spacing="0.5">queued</text>

  <!-- Sent -->
  <rect x="505" y="428" width="70" height="22" rx="11" fill="#1E1E2E" stroke="#005CEC" stroke-width="1" opacity="0.8"/>
  <circle cx="520" cy="439" r="4" fill="#005CEC"/>
  <text x="528" y="444" font-family="'SF Mono', monospace" font-size="10" fill="#005CEC" letter-spacing="0.5">sent</text>

  <!-- Delivered -->
  <rect x="585" y="428" width="96" height="22" rx="11" fill="#1E1E2E" stroke="#22C55E" stroke-width="1" opacity="0.8"/>
  <circle cx="600" cy="439" r="4" fill="#22C55E"/>
  <text x="608" y="444" font-family="'SF Mono', monospace" font-size="10" fill="#22C55E" letter-spacing="0.5">delivered</text>

  <!-- Read -->
  <rect x="691" y="428" width="64" height="22" rx="11" fill="#1E1E2E" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
  <circle cx="706" cy="439" r="4" fill="#22C55E" opacity="0.6"/>
  <text x="714" y="444" font-family="'SF Mono', monospace" font-size="10" fill="#22C55E" opacity="0.6" letter-spacing="0.5">read</text>

  <!-- Failed -->
  <rect x="765" y="428" width="64" height="22" rx="11" fill="#1E1E2E" stroke="#EC3B00" stroke-width="1" opacity="0.7"/>
  <circle cx="780" cy="439" r="4" fill="#EC3B00"/>
  <text x="788" y="444" font-family="'SF Mono', monospace" font-size="10" fill="#EC3B00" letter-spacing="0.5">failed</text>

  <!-- ─── BOTTOM STRIP ──────────────────────────────────────────── -->
  <line x1="0" y1="590" x2="1280" y2="590" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Left: package name in mono -->
  <text x="48" y="618"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="12" fill="#ffffff" opacity="0.22" letter-spacing="1">sudiptpa/laravel-sent-dm</text>

  <!-- Center: dots separator -->
  <text x="640" y="618"
        text-anchor="middle"
        font-family="'SF Mono', monospace"
        font-size="12" fill="#005CEC" opacity="0.35" letter-spacing="3">· · ·</text>

  <!-- Right: tagline -->
  <text x="1232" y="618"
        text-anchor="end"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="12" fill="#ffffff" opacity="0.22" letter-spacing="1">SMS · WhatsApp · RCS</text>

</svg>
