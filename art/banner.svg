<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">laravel-sent-dm</title>
  <desc id="d">A Laravel integration for the Sent.dm unified messaging API: SMS, WhatsApp and RCS.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#10101A"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F05340" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F05340" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D82FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3D82FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linkLeft" gradientUnits="userSpaceOnUse" x1="294" y1="190" x2="338" y2="190">
      <stop offset="0%" stop-color="#F05340"/>
      <stop offset="100%" stop-color="#3D82FF"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#dots)"/>
  <ellipse cx="200" cy="190" rx="300" ry="220" fill="url(#redGlow)"/>
  <ellipse cx="1080" cy="190" rx="300" ry="220" fill="url(#blueGlow)"/>

  <!-- Left node: Laravel -->
  <circle cx="200" cy="190" r="84" fill="none" stroke="#F05340" stroke-width="1" opacity="0.25"/>
  <circle cx="200" cy="190" r="64" fill="#1A0E0C" stroke="#F05340" stroke-width="2"/>
  <!-- Official Laravel logo mark (github.com/laravel/art) -->
  <g transform="translate(200, 190) scale(0.033) translate(-944, -944)">
    <path d="M791.5 1714L215 1381.5c-8.5-5.5-15-8.5-15-19.5V357.5c0-8.158 5-13.5 9.5-16L502 173c9.5-5.5 17.5-5.5 26.5 0L819 340c11.5 6.5 12 15 12 22.5v622L1073.5 845V527c0-11 5-17.5 17-24.5L1380 336c7-4 12.5-4 19.5 0l295 170c9.5 5.5 10.5 12 10.5 21.5V858c0 10.5-2.5 16-13 22.5l-278.5 160v317c0 12.5-3 17.5-14 24L821 1714c-11 6-18.5 6-29.5 0zm-9-61.5v-279l-276-156c-9-5.5-15.5-9.5-15.5-23V543L248 403.5V1345zm583-307.5v-277L831 1373.5v279zm-25.528-318.167L1098 886.5 565 1194l241 137zM782.5 1012V403L540 543v609zm583-28V708l-243-140v277zm291-139V568l-243 140v276zm-267-179.5l242-139.5-242-139.5L1147 526zM757.635 361.004L515 221.5 273 361l242 140z" fill="#F05340"/>
  </g>
  <text x="200" y="302" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#F4F4F5" letter-spacing="1">Laravel</text>

  <!-- Links -->
  <line x1="294" y1="190" x2="338" y2="190" stroke="url(#linkLeft)" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <line x1="942" y1="190" x2="986" y2="190" stroke="#3D82FF" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- Centre: package name -->
  <text x="640" y="216" text-anchor="middle" textLength="572" lengthAdjust="spacingAndGlyphs" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="800"><tspan fill="#F05340">laravel-</tspan><tspan fill="#3D82FF">sent-dm</tspan></text>
  <text x="640" y="268" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#C4C4CC" letter-spacing="0.5">Unified messaging for Laravel</text>

  <!-- Right node: Sent.dm -->
  <circle cx="1080" cy="190" r="84" fill="none" stroke="#3D82FF" stroke-width="1" opacity="0.25"/>
  <circle cx="1080" cy="190" r="64" fill="#0D1A33" stroke="#3D82FF" stroke-width="2"/>
  <!-- Official Sent.dm logo mark (viewBox 0 0 1000 1000) -->
  <g transform="translate(1036, 146) scale(0.088)">
    <path d="M413.439 275.528C396.838 269.254 388.466 250.709 394.74 234.108L456.845 69.7828C463.119 53.1814 481.664 44.8096 498.265 51.0839L979.217 232.854C995.819 239.128 1004.19 257.672 997.916 274.274L816.146 755.226C809.872 771.827 791.328 780.199 774.726 773.925L610.401 711.82C593.799 705.546 585.428 687.001 591.702 670.4L688.646 413.892C694.92 397.291 686.548 378.746 669.947 372.472L413.439 275.528Z" fill="#FFFFFF"/>
    <path d="M20.7828 451.048C4.18136 444.774 -4.19043 426.229 2.08387 409.628L64.1885 245.303C70.4628 228.701 89.0073 220.33 105.609 226.604L586.561 408.374C603.162 414.648 611.534 433.192 605.26 449.794L423.49 930.746C417.216 947.347 398.671 955.719 382.07 949.445L217.744 887.34C201.143 881.066 192.771 862.521 199.046 845.92L295.989 589.412C302.264 572.811 293.892 554.266 277.291 547.992L20.7828 451.048Z" fill="#FFFFFF"/>
  </g>
  <text x="1080" y="302" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#F4F4F5" letter-spacing="1">Sent.dm</text>
  <text x="1080" y="330" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#A1A1AA">SMS · WhatsApp · RCS</text>

  <!-- Delivery states -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600">
    <rect x="342" y="326" width="110" height="36" rx="18" fill="#12121C" stroke="#71717A" stroke-width="1.5"/>
    <circle cx="362" cy="344" r="5" fill="#A1A1AA"/>
    <text x="376" y="350" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#D4D4D8">queued</text>

    <rect x="466" y="326" width="90" height="36" rx="18" fill="#12121C" stroke="#3D82FF" stroke-width="1.5"/>
    <circle cx="486" cy="344" r="5" fill="#3D82FF"/>
    <text x="500" y="350" textLength="40" lengthAdjust="spacingAndGlyphs" fill="#8DB8FF">sent</text>

    <rect x="570" y="326" width="140" height="36" rx="18" fill="#12121C" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="590" cy="344" r="5" fill="#22C55E"/>
    <text x="604" y="350" textLength="90" lengthAdjust="spacingAndGlyphs" fill="#4ADE80">delivered</text>

    <rect x="724" y="326" width="90" height="36" rx="18" fill="#12121C" stroke="#2DD4BF" stroke-width="1.5"/>
    <circle cx="744" cy="344" r="5" fill="#2DD4BF"/>
    <text x="758" y="350" textLength="40" lengthAdjust="spacingAndGlyphs" fill="#5EEAD4">read</text>

    <rect x="828" y="326" width="110" height="36" rx="18" fill="#12121C" stroke="#F87171" stroke-width="1.5"/>
    <circle cx="848" cy="344" r="5" fill="#F87171"/>
    <text x="862" y="350" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#FCA5A5">failed</text>
  </g>
</svg>
